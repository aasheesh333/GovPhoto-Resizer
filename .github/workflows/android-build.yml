name: Android Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Populate secrets.properties from secrets
        env:
          PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          CONTACT_URL: ${{ secrets.CONTACT_URL }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT: ${{ secrets.ADMOB_BANNER_UNIT }}
          ADMOB_INTERSTITIAL_UNIT: ${{ secrets.ADMOB_INTERSTITIAL_UNIT }}
          ADMOB_REWARDED_UNIT: ${{ secrets.ADMOB_REWARDED_UNIT }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: bash app/scripts/populate-secrets.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Debug AAB
        run: ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Populate secrets.properties from secrets
        env:
          PRIVACY_URL: ${{ secrets.PRIVACY_URL }}
          TERMS_URL: ${{ secrets.TERMS_URL }}
          CONTACT_URL: ${{ secrets.CONTACT_URL }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_UNIT: ${{ secrets.ADMOB_BANNER_UNIT }}
          ADMOB_INTERSTITIAL_UNIT: ${{ secrets.ADMOB_INTERSTITIAL_UNIT }}
          ADMOB_REWARDED_UNIT: ${{ secrets.ADMOB_REWARDED_UNIT }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: bash app/scripts/populate-secrets.sh

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
